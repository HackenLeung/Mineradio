name: Checks

# quick-check 是仓库唯一的整体回归入口：模块解析、静态扫描、40 多项守卫、
# 以及 tests/ 下的全部测试。它在 7b7a260..e272dda 之间连续四个提交处于失败
# 状态而无人察觉，就是因为它只在本机手动跑。这里把它放到每次推送和 PR 上。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支的新推送作废上一轮，避免排队。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: Syntax, guards, and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 静态守卫直接读源码文本，测试也只在源码上做 vm 求值，不需要原生模块
      # 编译或 Electron 二进制下载，所以跳过全部安装脚本。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run quick-check
        run: node scripts/quick-check.js

      - name: Run test suite
        run: node --test "tests/*.test.js"
